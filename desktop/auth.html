<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; form-action 'none'; base-uri 'none'">
<title>Gateway sign in</title><link rel="stylesheet" href="auth.css"></head>
<body><h1>Gateway sign in</h1><p id="host"></p>
<form><label>Username<input name="username" autocomplete="username" required autofocus></label>
<label>Password<input name="password" type="password" autocomplete="current-password" required></label>
<div><button type="button" id="cancel">Cancel</button><button type="submit">Sign in</button></div></form>
<script src="auth.js"></script></body></html>
